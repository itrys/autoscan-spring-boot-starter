spring:
  application:
    name: AutoScanApplication

auto-scan:
  # Base package paths (required)
  # Supports wildcards: * for single level, ** for multi-level
  base-packages:
    - org.example.boot        # Technical infrastructure
    - org.example.wildcard.*  # Single-level wildcard
    - org.example.**          # Multi-level wildcard (if needed)
  
  # Business package paths (optional)
  business-packages:
    - org.example.business
  
  # Exclude packages (optional) - v1.1.0+
  exclude-packages:
    - org.example.exclude.test    # Exclude test packages
    - org.example.exclude.example # Exclude example packages
  
  # Exclude classes (optional) - v1.1.0+
  exclude-classes:
    - org.example.exclude.example.ExcludedComponent  # Exclude specific class
  
  # Include annotations (optional) - v1.1.0+
  include-annotations:
    - org.springframework.stereotype.Service
    - org.springframework.stereotype.Controller
    - org.example.annotation.CustomComponent  # Custom annotation
  
  # Development mode
  # true: Output detailed scanning logs
  # false: Silent mode
  # Default is auto-detected based on spring.profiles.active (dev/local/test = true)
  dev-mode: true
  
  # Enable switch - v1.2.0+
  # true: Enable AutoScan
  # false: Disable AutoScan
  # Default: true
  enabled: true
  
  # @Import compatibility - v1.2.0+
  # Directly import specific classes, similar to @Import annotation
  # imports:
  #   - org.example.config.AppConfig
  #   - org.example.config.WebConfig
  
  # Lazy initialization - v1.2.0+
  # true: Enable lazy initialization for all scanned beans
  # false: Disable lazy initialization
  # Default: false
  # lazy-initialization: true
  
  # Lazy packages - v1.2.0+
  # Enable lazy initialization for specific packages
  # lazy-packages:
  #   - org.example.service
  #   - org.example.repository
  
  # Lazy classes - v1.2.0+
  # Enable lazy initialization for specific classes
  # lazy-classes:
  #   - org.example.controller.UserController
  #   - org.example.service.OrderService
